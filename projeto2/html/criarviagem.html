<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/criarviagem.css">
    <link rel="stylesheet" href="../css/index.css">
    <title>Criar Nova Viagem</title>
</head>

<body>

    <header class="site-header">
    <nav class="navbar">
      <a class="brand" href="index.html" aria-label="GoTogether - pagina inicial">GoTogether</a>

      <ul class="menu">
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="index.html#viagens">Descobrir viagens</a></li>
        <li><a class="active" href="minhas-viagens.html" aria-current="page">Minhas viagens</a></li>
        <li><a href="index.html#sobre">Sobre</a></li>
      </ul>

      <div class="nav-actions">
        <a href="login.html" class="login-btn">Login</a>
        <a href="cadastro.html" class="signup-btn">Cadastro</a>
      </div>
    </nav>
  </header>

    <section>

        <form action="#" method="POST">

            <fieldset>

                <legend>Informações da Viagem</legend>

                <div class="container">
                    <h1>Criar Nova Viagem</h1>
                </div>

                <div class="linha">

                    <div class="campo">
                        <label for="nome">Nome da viagem</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>

                    <div class="campo">
                        <label for="orcamento">Orçamento</label>
                        <input type="number" id="orcamento" name="orcamento" required>
                    </div>

                </div>

                <div class="linha">

                    <div class="campo">
                        <label for="data_inicio">Data de início</label>
                        <input type="date" id="data_inicio" name="data_inicio" required>
                    </div>

                    <div class="campo">
                        <label for="data_fim">Data de fim</label>
                        <input type="date" id="data_fim" name="data_fim" required>
                    </div>

                </div>

                <div class="linha">

                    <div class="campo">
                        <label for="destino">Destino</label>
                        <input type="text" id="destino" name="destino" required>
                    </div>

                    <div class="campo">
                        <label for="descricao">Descrição</label>
                        <textarea id="descricao" name="descricao" rows="4" required></textarea>
                    </div>

                </div>

                <input type="submit" value="Criar Viagem">
            </fieldset>
        </form>
    </section>
   
</body>
</html>
