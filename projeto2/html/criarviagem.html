<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/criarviagem.css">
    <title>Criar Nova Viagem</title>
</head>

<body>

    <div class="pagina">

        <div class="card-lateral">

            <div class="imagem">
                <img src="../imagens/bondinhorj.jpeg" alt="Imagem de viagem">
            </div>

            <div class="mensagem">
                <h2>Transforme planos<br>em histórias reais</h2>

                <p>
                    Crie sua viagem, reúna seu grupo
                    e viva novas experiências!
                </p>
            </div>

            <p class="frase">
                ✈️ Viagens em grupo são mais divertidas!
            </p>

        </div>

        <section>

            <form action="#" method="POST">

                <fieldset>

                    <legend>Informações da Viagem</legend>

                    <h1> Criar Nova Viagem</h1>

                    <p class="subtitulo">
                        Preencha as informações abaixo para planejar
                        sua próxima aventura com o seu grupo!
                    </p>

                    <div class="linha">

                        <div class="campo">
                            <label for="nome">Nome da viagem</label>

                            <input
                                type="text"
                                id="nome"
                                name="nome"
                                placeholder="Ex: Férias em Gramado"
                                required
                            >
                        </div>

                    </div>

                    <div class="linha">

                        <div class="campo">
                            <label for="destino">Destino</label>

                            <input
                                type="text"
                                id="destino"
                                name="destino"
                                placeholder="Ex: Rio de Janeiro"
                                required
                            >
                        </div>

                    </div>


                    <div class="linha">

                        <div class="campo">
                            <label for="data_inicio">Data de início</label>

                            <input
                                type="date"
                                id="data_inicio"
                                name="data_inicio"
                                required
                            >
                        </div>


                        <div class="campo">
                            <label for="data_fim">Data de fim</label>

                            <input
                                type="date"
                                id="data_fim"
                                name="data_fim"
                                required
                            >
                        </div>

                    </div>


                    <div class="linha">

                        <div class="campo">
                            <label for="orcamento">Orçamento</label>

                            <input
                                type="number"
                                id="orcamento"
                                name="orcamento"
                                placeholder="Ex: 2500"
                                required
                            >
                        </div>

                    </div>


                    <div class="linha">

                        <div class="campo">
                            <label for="descricao">Descrição</label>

                            <textarea
                                id="descricao"
                                name="descricao"
                                rows="4"
                                placeholder="Conte um pouco sobre essa viagem..."
                                required
                            ></textarea>
                        </div>

                    </div>

                    <input
                        type="submit"
                        value="✈️ Criar Viagem"
                    >

                </fieldset>
            </form>
        </section>
    </div>
    <script src="../Js/criarviagem.js"></script>
</body>

</html>
