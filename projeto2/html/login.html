<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Entre na sua conta GoTogether para continuar organizando suas viagens.">
  <title>Entrar | GoTogether</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/login.css">
  <link rel="stylesheet" href="../css/footer.css">
  <link rel="stylesheet" href="../css/darkmode.css">
  <script src="../Js/login.js" defer></script>
</head>
<body>
  <header class="site-header">
    <nav class="navbar" aria-label="Navegação principal">
      <a class="brand" href="../index.html">GoTogether</a>
      <ul class="menu">
        <li><a href="../index.html">Início</a></li>
        <li><a href="criarviagem.html">Planejar</a></li>
        <li><a href="minhas-viagens.html">Minhas viagens</a></li>
      </ul>
      <div class="nav-actions">
        <button id="darkModeToggle" class="dark-mode-btn" type="button" aria-label="Ativar modo escuro">🌙</button>
        <a href="cadastro.html" class="signup-btn">Criar conta</a>
      </div>
    </nav>
  </header>

  <main class="login-main">
    <section class="login-card" aria-labelledby="login-title">
      <p class="login-kicker">BEM-VINDO DE VOLTA</p>
      <h1 id="login-title">Entre na sua conta</h1>
      <p class="login-description">Acesse sua conta para continuar planejando suas viagens.</p>

      <form id="form-login" novalidate>
        <div class="login-field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" autocomplete="email" required aria-describedby="erro-email">
          <span class="erro" id="erro-email" role="alert"></span>
        </div>
        <div class="login-field">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" autocomplete="current-password" required aria-describedby="erro-senha">
          <span class="erro" id="erro-senha" role="alert"></span>
        </div>
        <button type="submit">Entrar</button>
        <p id="status-login" role="status" aria-live="polite"></p>
      </form>

      <p class="login-signup">Ainda não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
    </section>
  </main>

  <footer class="site-footer simple-footer">
    <p>GoTogether · Planeje junto. Viaje melhor.</p>
    <a href="../index.html">Voltar ao início</a>
  </footer>
  <script src="../Js/darkmode.js"></script>
  <script src="../Js/header.js"></script>
</body>
</html>
